<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ThemeEffects 音乐宿主</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0c1018;
      color: #cfe8f5;
      font: 12px/1.4 system-ui, sans-serif;
    }
    body { padding: 10px 12px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .s { opacity: 0.7; font-size: 11px; }
    button {
      border: 1px solid rgba(0, 243, 255, 0.28);
      background: rgba(0, 243, 255, 0.12);
      color: #9fefff;
      border-radius: 8px;
      padding: 4px 8px;
      cursor: pointer;
    }
    .hint { margin-top: 8px; opacity: 0.65; font-size: 11px; }
  </style>
</head>
<body>
  <div class="row">
    <span aria-hidden="true">♪</span>
    <div style="min-width:0;flex:1">
      <div class="t" id="title">ThemeEffects 音乐宿主</div>
      <div class="s" id="sub">保持此窗口开启，切换 Unraid 页面可无感续播</div>
    </div>
    <button type="button" id="btn" title="播放/暂停">播放</button>
  </div>
  <div class="hint">请勿关闭本窗口。可最小化。关闭后将退回页面内播放（可能需再点一次）。</div>
  <script>
(function () {
  "use strict";
  try { window.__UCWC_MUSIC_HOST__ = true; } catch (e0) {}
  var API = "/plugins/theme.effects/ucwc-music-api.php";
  var CH = "ucwc-music-host-v1";
  var PLAY_KEY = "ucwc_music_play_v1";
  var audio = new Audio();
  audio.preload = "auto";
  try {
    audio.setAttribute("playsinline", "true");
    audio.playsInline = true;
  } catch (e1) {}
  var tracks = [];
  var index = 0;
  var volume = 0.7;
  var shuffle = false;
  var repeat = "off";
  var lastId = "";
  var bc = null;
  try { bc = new BroadcastChannel(CH); } catch (e2) {}

  function el(id) { return document.getElementById(id); }
  function current() {
    if (!tracks.length) return null;
    if (index < 0) index = 0;
    if (index >= tracks.length) index = 0;
    return tracks[index];
  }
  function trackUrl(id) {
    return API + "?action=stream&id=" + encodeURIComponent(id) + "&_ts=" + Date.now();
  }
  function saveSession(playing) {
    try {
      var t = current();
      var payload = JSON.stringify({
        playing: !!playing,
        intent: !!playing,
        index: index,
        t: audio && isFinite(audio.currentTime) ? audio.currentTime : 0,
        id: t && t.id ? t.id : "",
        vol: volume,
        sitewide: true,
        host: true,
        ts: Date.now(),
      });
      try { sessionStorage.setItem(PLAY_KEY, payload); } catch (e0) {}
      try { localStorage.setItem(PLAY_KEY, payload); } catch (e1) {}
    } catch (e) {}
  }
  function broadcast(msg) {
    msg = msg || {};
    msg.from = "host";
    msg.ts = Date.now();
    try { if (bc) bc.postMessage(msg); } catch (e0) {}
    try {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(Object.assign({ channel: CH }, msg), location.origin);
      }
    } catch (e1) {}
  }
  function statusSnap() {
    var t = current();
    return {
      type: "state",
      playing: !!(audio && !audio.paused),
      index: index,
      t: audio && isFinite(audio.currentTime) ? audio.currentTime : 0,
      id: t && t.id ? t.id : "",
      title: t && t.title ? t.title : "",
      artist: t && t.artist ? t.artist : "",
      volume: volume,
      shuffle: shuffle,
      repeat: repeat,
      tracks: tracks.length,
    };
  }
  function pushState() {
    var s = statusSnap();
    var t = current();
    el("title").textContent = (t && t.title) || "ThemeEffects 音乐宿主";
    el("sub").textContent = audio && !audio.paused
      ? "播放中 · 请保持窗口开启"
      : "已暂停 · 主页面 chip 可控制";
    el("btn").textContent = audio && !audio.paused ? "暂停" : "播放";
    broadcast(s);
    saveSession(!!(audio && !audio.paused));
  }
  function loadList() {
    return fetch(API + "?action=list&_ts=" + Date.now(), {
      credentials: "same-origin",
      headers: { Accept: "application/json" },
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.ok && Array.isArray(j.tracks)) tracks = j.tracks;
        else tracks = [];
        pushState();
        return tracks;
      })
      .catch(function () {
        tracks = [];
        return tracks;
      });
  }
  function playAt(idx, autoPlay, startAt) {
    if (!tracks.length) return Promise.resolve(false);
    index = ((idx % tracks.length) + tracks.length) % tracks.length;
    var t = current();
    if (!t) return Promise.resolve(false);
    var seekTo = typeof startAt === "number" && isFinite(startAt) && startAt > 0 ? startAt : 0;
    if (lastId !== t.id || !audio.src) {
      lastId = t.id;
      try { audio.pause(); } catch (e0) {}
      audio.src = trackUrl(t.id);
    }
    function apply() {
      if (seekTo > 0) {
        try { audio.currentTime = seekTo; } catch (e1) {}
      }
      audio.volume = volume;
      if (!autoPlay) {
        pushState();
        return Promise.resolve(true);
      }
      return audio.play().then(function () {
        pushState();
        return true;
      }).catch(function () {
        // host was opened by user gesture usually; still try muted unlock
        try { audio.muted = true; audio.volume = 0; } catch (e2) {}
        return audio.play().then(function () {
          try { audio.muted = false; audio.volume = volume; } catch (e3) {}
          pushState();
          return true;
        }).catch(function () {
          pushState();
          return false;
        });
      });
    }
    if (audio.readyState >= 1) return apply();
    return new Promise(function (resolve) {
      var done = false;
      function go() {
        if (done) return;
        done = true;
        try {
          audio.removeEventListener("loadedmetadata", go);
          audio.removeEventListener("canplay", go);
        } catch (e4) {}
        apply().then(resolve);
      }
      audio.addEventListener("loadedmetadata", go);
      audio.addEventListener("canplay", go);
      setTimeout(go, 1200);
    });
  }
  function toggle() {
    if (!audio.src) {
      return playAt(index, true, 0);
    }
    if (audio.paused) {
      return audio.play().then(function () { pushState(); return true; })
        .catch(function () { pushState(); return false; });
    }
    audio.pause();
    pushState();
    return Promise.resolve(true);
  }
  function next(fromEnded) {
    if (!tracks.length) return;
    var n;
    if (shuffle && tracks.length > 1) {
      n = index;
      var g = 0;
      while (n === index && g++ < 20) n = Math.floor(Math.random() * tracks.length);
    } else {
      n = index + 1;
      if (n >= tracks.length) {
        if (repeat === "all") n = 0;
        else if (fromEnded) {
          pushState();
          return;
        } else n = 0;
      }
    }
    playAt(n, true, 0);
  }
  function prev() {
    if (!tracks.length) return;
    if (audio.currentTime > 3) {
      audio.currentTime = 0;
      pushState();
      return;
    }
    var n = index - 1;
    if (n < 0) n = tracks.length - 1;
    playAt(n, true, 0);
  }
  function handleCmd(data) {
    if (!data || data.from === "host") return;
    var type = data.type || data.cmd;
    if (type === "ping" || type === "hello" || type === "sync") {
      broadcast(statusSnap());
      return;
    }
    if (type === "config") {
      if (typeof data.volume === "number") {
        volume = Math.max(0, Math.min(1, data.volume));
        audio.volume = volume;
      }
      if (typeof data.shuffle === "boolean") shuffle = data.shuffle;
      if (data.repeat === "off" || data.repeat === "one" || data.repeat === "all") repeat = data.repeat;
      pushState();
      return;
    }
    if (type === "list-refresh") {
      loadList();
      return;
    }
    function withList(fn) {
      if (tracks.length) return fn();
      return loadList().then(fn);
    }
    if (type === "playAt") {
      withList(function () {
        if (typeof data.volume === "number") {
          volume = Math.max(0, Math.min(1, data.volume));
          audio.volume = volume;
        }
        return playAt(
          typeof data.index === "number" ? data.index : index,
          data.autoPlay !== false,
          typeof data.t === "number" ? data.t : 0
        );
      });
      return;
    }
    if (type === "play" || type === "resume") {
      withList(function () {
        if (data.id || typeof data.index === "number") {
          var idx = typeof data.index === "number" ? data.index : index;
          if (data.id) {
            for (var i = 0; i < tracks.length; i++) {
              if (tracks[i] && tracks[i].id === data.id) { idx = i; break; }
            }
          }
          return playAt(idx, true, typeof data.t === "number" ? data.t : 0);
        }
        return toggle().then(function (ok) {
          if (!ok || (audio && audio.paused)) return playAt(index, true, typeof data.t === "number" ? data.t : 0);
          return ok;
        });
      });
      return;
    }
    if (type === "pause") {
      try { audio.pause(); } catch (e0) {}
      pushState();
      return;
    }
    if (type === "toggle") {
      withList(function () { return toggle(); });
      return;
    }
    if (type === "next") { withList(function () { next(false); }); return; }
    if (type === "prev") { withList(function () { prev(); }); return; }
    if (type === "seek" && typeof data.t === "number") {
      try { audio.currentTime = data.t; } catch (e1) {}
      pushState();
    }
  }

  audio.addEventListener("play", pushState);
  audio.addEventListener("pause", pushState);
  audio.addEventListener("timeupdate", function () {
    if (!audio || audio.paused) return;
    // lightweight persist
    if ((Math.floor(audio.currentTime * 2) % 4) === 0) saveSession(true);
  });
  audio.addEventListener("ended", function () {
    if (repeat === "one") playAt(index, true, 0);
    else next(true);
  });
  el("btn").addEventListener("click", function () { toggle(); });

  if (bc) bc.onmessage = function (ev) { handleCmd(ev.data); };
  window.addEventListener("message", function (ev) {
    try {
      if (ev.origin !== location.origin) return;
      var d = ev.data;
      if (!d || d.channel !== CH) return;
      handleCmd(d);
    } catch (e0) {}
  });
  window.addEventListener("beforeunload", function () {
    broadcast({ type: "host-gone" });
    saveSession(!!(audio && !audio.paused));
  });

  // boot: load list + announce
  loadList().then(function () {
    broadcast({ type: "host-ready" });
    pushState();
  });
})();
  </script>
</body>
</html>
