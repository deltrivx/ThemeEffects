<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ThemeEffects 音乐</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: #eef6ff;
      font: 12px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    /* Match page chip style exactly */
    #ucwc-music-resume-chip,
    .ucwc-music-resume-chip {
      all: unset;
      position: relative !important;
      z-index: 1 !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: stretch !important;
      gap: 6px !important;
      width: min(340px, calc(100vw - 16px)) !important;
      max-width: min(340px, calc(100vw - 16px)) !important;
      padding: 10px 12px !important;
      border-radius: 16px !important;
      border: 1px solid rgba(0, 243, 255, 0.32) !important;
      background: rgba(12, 16, 24, 0.92) !important;
      color: #eef6ff !important;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.48) !important;
      cursor: default !important;
      font-size: 12px !important;
      line-height: 1.3 !important;
      box-sizing: border-box !important;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .ucwc-music-chip-row {
      display: flex !important;
      align-items: center !important;
      gap: 8px !important;
      min-width: 0;
    }
    .ucwc-music-chip-ico { flex: 0 0 auto; opacity: 0.9; font-size: 14px; }
    .ucwc-music-chip-meta {
      flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px;
    }
    .ucwc-music-chip-title {
      min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-weight: 600; font-size: 12px; color: #fff;
    }
    .ucwc-music-chip-lrc {
      min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-size: 11px; opacity: 0.72; color: #9fefff; min-height: 14px;
    }
    .ucwc-music-chip-btns {
      display: inline-flex !important; align-items: center !important; gap: 4px !important; flex: 0 0 auto;
    }
    .ucwc-music-chip-btn {
      all: unset; box-sizing: border-box !important;
      display: inline-flex !important; align-items: center !important; justify-content: center !important;
      width: 28px !important; height: 28px !important; min-width: 28px !important;
      border-radius: 50% !important; border: 1px solid rgba(255, 255, 255, 0.14) !important;
      background: rgba(255, 255, 255, 0.06) !important; color: #eef6ff !important;
      cursor: pointer !important; flex: 0 0 28px !important;
    }
    .ucwc-music-chip-btn:hover {
      background: rgba(0, 243, 255, 0.16) !important;
      border-color: rgba(0, 243, 255, 0.4) !important;
    }
    .ucwc-music-chip-btn.primary {
      background: rgba(0, 243, 255, 0.18) !important;
      border-color: rgba(0, 243, 255, 0.42) !important;
    }
    .ucwc-music-chip-btn svg { width: 12px; height: 12px; display: block; pointer-events: none; }
    .ucwc-music-chip-handle {
      flex: 0 0 auto; width: 14px; height: 28px; opacity: 0.35;
      display: inline-flex; align-items: center; justify-content: center;
      letter-spacing: -2px; font-size: 11px; cursor: default;
    }
    body.ucwc-host-body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: rgba(8, 10, 14, 0.55);
      padding: 8px; box-sizing: border-box;
    }
  </style>
</head>
<body class="ucwc-host-body">
  <div id="ucwc-music-resume-chip" class="ucwc-music-resume-chip" role="region" aria-label="全站音乐控制">
    <div class="ucwc-music-chip-row">
      <span class="ucwc-music-chip-handle" title="宿主窗" aria-hidden="true">⋮⋮</span>
      <span class="ucwc-music-chip-ico" aria-hidden="true">♪</span>
      <div class="ucwc-music-chip-meta">
        <div class="ucwc-music-chip-title" id="title">ThemeEffects 音乐</div>
        <div class="ucwc-music-chip-lrc" id="sub">保持开启 · 切页不中断</div>
      </div>
      <div class="ucwc-music-chip-btns">
        <button type="button" class="ucwc-music-chip-btn prev" id="prev" title="上一首" aria-label="上一首"></button>
        <button type="button" class="ucwc-music-chip-btn primary play" id="play" title="播放" aria-label="播放"></button>
        <button type="button" class="ucwc-music-chip-btn next" id="next" title="下一首" aria-label="下一首"></button>
      </div>
    </div>
  </div>
  <script>
(function () {
  "use strict";
  try { window.__UCWC_MUSIC_HOST__ = true; } catch (e0) {}
  var API = "/plugins/theme.effects/ucwc-music-api.php";
  var CH = "ucwc-music-host-v1";
  var PLAY_KEY = "ucwc_music_play_v1";
  var HEART_KEY = "ucwc_music_host_hb_v1";
  var HB_MAX_MS = 25000; // Unraid tab gone → close host
  var audio = new Audio();
  audio.preload = "auto";
  try { audio.setAttribute("playsinline", "true"); audio.playsInline = true; } catch (e1) {}
  var tracks = [];
  var index = 0;
  var volume = 0.7;
  var shuffle = false;
  var repeat = "off";
  var lastId = "";
  var pendingSeek = 0;
  var bc = null;
  try { bc = new BroadcastChannel(CH); } catch (e2) {}

  function svg(name) {
    var c = ' xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
    if (name === "play") return "<svg" + c + '><polygon points="6 4 20 12 6 20 6 4" fill="currentColor" stroke="none"/></svg>';
    if (name === "pause") return "<svg" + c + '><rect x="6" y="5" width="4" height="14" fill="currentColor" stroke="none"/><rect x="14" y="5" width="4" height="14" fill="currentColor" stroke="none"/></svg>';
    if (name === "prev") return "<svg" + c + '><polygon points="19 20 9 12 19 4 19 20" fill="currentColor" stroke="none"/><line x1="5" y1="4" x2="5" y2="20"/></svg>';
    if (name === "next") return "<svg" + c + '><polygon points="5 4 15 12 5 20 5 4" fill="currentColor" stroke="none"/><line x1="19" y1="4" x2="19" y2="20"/></svg>';
    return "";
  }
  function el(id) { return document.getElementById(id); }
  function current() {
    if (!tracks.length) return null;
    if (index < 0) index = 0;
    if (index >= tracks.length) index = 0;
    return tracks[index];
  }
  function trackUrl(id) {
    var v = 1;
    try { v = encodeURIComponent(String(id || "")).length || 1; } catch (e0) { v = 1; }
    return API + "?action=stream&id=" + encodeURIComponent(id) + "&_v=" + v;
  }
  function saveSession(playing) {
    try {
      var t = current();
      var curT = audio && isFinite(audio.currentTime) ? audio.currentTime : 0;
      if (pendingSeek > 0.5 && curT < 0.35) curT = pendingSeek;
      var payload = JSON.stringify({
        playing: !!playing,
        intent: !!playing,
        index: index,
        t: curT,
        id: t && t.id ? t.id : "",
        vol: volume,
        sitewide: true,
        host: true,
        ts: Date.now(),
      });
      try { sessionStorage.setItem(PLAY_KEY, payload); } catch (e0) {}
      try { localStorage.setItem(PLAY_KEY, payload); } catch (e1) {}
    } catch (e) {}
  }
  function broadcast(msg) {
    msg = msg || {};
    msg.from = "host";
    msg.ts = Date.now();
    try { if (bc) bc.postMessage(msg); } catch (e0) {}
    try {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(Object.assign({ channel: CH }, msg), location.origin);
      }
    } catch (e1) {}
  }
  function statusSnap() {
    var t = current();
    return {
      type: "state",
      playing: !!(audio && !audio.paused),
      index: index,
      t: audio && isFinite(audio.currentTime) ? audio.currentTime : (pendingSeek || 0),
      id: t && t.id ? t.id : "",
      title: t && t.title ? t.title : "",
      artist: t && t.artist ? t.artist : "",
      volume: volume,
      shuffle: shuffle,
      repeat: repeat,
      tracks: tracks.length,
    };
  }
  function pushState() {
    var s = statusSnap();
    var t = current();
    el("title").textContent = (t && t.title) || "ThemeEffects 音乐";
    var line = "";
    if (audio && !audio.paused) line = "♪ 播放中 · 切页不中断";
    else if (t) line = (t.artist ? t.artist + " · " : "") + "已暂停";
    else line = "保持开启 · 切页不中断";
    el("sub").textContent = line;
    el("play").innerHTML = audio && !audio.paused ? svg("pause") : svg("play");
    el("play").title = audio && !audio.paused ? "暂停" : "播放";
    el("play").setAttribute("aria-label", el("play").title);
    broadcast(s);
    saveSession(!!(audio && !audio.paused));
  }
  function loadList() {
    return fetch(API + "?action=list&_ts=" + Date.now(), {
      credentials: "same-origin",
      headers: { Accept: "application/json" },
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.ok && Array.isArray(j.tracks)) tracks = j.tracks;
        else tracks = [];
        pushState();
        return tracks;
      })
      .catch(function () { tracks = []; return tracks; });
  }
  function applySeek(target) {
    if (!(target > 0.25)) return true;
    try {
      if (isFinite(audio.duration) && audio.duration > 0) {
        var capped = Math.min(target, Math.max(0, audio.duration - 0.25));
        if (Math.abs((audio.currentTime || 0) - capped) > 0.6) audio.currentTime = capped;
        pendingSeek = 0;
        return true;
      }
      audio.currentTime = target;
      return false;
    } catch (e0) { return false; }
  }
  function playAt(idx, autoPlay, startAt) {
    if (!tracks.length) return Promise.resolve(false);
    index = ((idx % tracks.length) + tracks.length) % tracks.length;
    var t = current();
    if (!t) return Promise.resolve(false);
    var seekTo = typeof startAt === "number" && isFinite(startAt) && startAt > 0 ? startAt : 0;
    if (seekTo > 0.5) pendingSeek = seekTo;
    if (lastId !== t.id || !audio.src) {
      lastId = t.id;
      try { audio.pause(); } catch (e0) {}
      audio.src = trackUrl(t.id);
      try { audio.load(); } catch (eL) {}
    }
    function apply() {
      applySeek(pendingSeek > 0.5 ? pendingSeek : seekTo);
      audio.volume = volume;
      pushState();
      if (!autoPlay) return Promise.resolve(true);
      return audio.play().then(function () {
        applySeek(pendingSeek > 0.5 ? pendingSeek : seekTo);
        pushState();
        return true;
      }).catch(function () {
        try { audio.muted = true; audio.volume = 0; } catch (e2) {}
        return audio.play().then(function () {
          try { audio.muted = false; audio.volume = volume; } catch (e3) {}
          applySeek(pendingSeek > 0.5 ? pendingSeek : seekTo);
          pushState();
          return true;
        }).catch(function () {
          pushState();
          return false;
        });
      });
    }
    if (audio.readyState >= 1) return apply();
    return new Promise(function (resolve) {
      var done = false;
      function go() {
        if (done) return;
        done = true;
        try {
          audio.removeEventListener("loadedmetadata", go);
          audio.removeEventListener("canplay", go);
        } catch (e4) {}
        apply().then(resolve);
      }
      audio.addEventListener("loadedmetadata", go);
      audio.addEventListener("canplay", go);
      setTimeout(go, 1500);
    });
  }
  function toggle() {
    if (!audio.src) return playAt(index, true, pendingSeek || 0);
    if (audio.paused) {
      return audio.play().then(function () { pushState(); return true; })
        .catch(function () { pushState(); return false; });
    }
    audio.pause();
    pushState();
    return Promise.resolve(true);
  }
  function next(fromEnded) {
    if (!tracks.length) return;
    pendingSeek = 0;
    var n;
    if (shuffle && tracks.length > 1) {
      n = index; var g = 0;
      while (n === index && g++ < 20) n = Math.floor(Math.random() * tracks.length);
    } else {
      n = index + 1;
      if (n >= tracks.length) {
        if (repeat === "all") n = 0;
        else if (fromEnded) { pushState(); return; }
        else n = 0;
      }
    }
    playAt(n, true, 0);
  }
  function prev() {
    if (!tracks.length) return;
    if (audio.currentTime > 3) {
      audio.currentTime = 0; pendingSeek = 0; pushState(); return;
    }
    pendingSeek = 0;
    var n = index - 1;
    if (n < 0) n = tracks.length - 1;
    playAt(n, true, 0);
  }
  function handleCmd(data) {
    if (!data || data.from === "host") return;
    var type = data.type || data.cmd;
    if (type === "heartbeat") {
      try { localStorage.setItem(HEART_KEY, String(Date.now())); } catch (e0) {}
      return;
    }
    if (type === "ping" || type === "hello" || type === "sync") {
      broadcast(statusSnap());
      return;
    }
    if (type === "config") {
      if (typeof data.volume === "number") {
        volume = Math.max(0, Math.min(1, data.volume));
        audio.volume = volume;
      }
      if (typeof data.shuffle === "boolean") shuffle = data.shuffle;
      if (data.repeat === "off" || data.repeat === "one" || data.repeat === "all") repeat = data.repeat;
      pushState();
      return;
    }
    if (type === "list-refresh") { loadList(); return; }
    function withList(fn) {
      if (tracks.length) return fn();
      return loadList().then(fn);
    }
    if (type === "playAt") {
      withList(function () {
        if (typeof data.volume === "number") {
          volume = Math.max(0, Math.min(1, data.volume));
          audio.volume = volume;
        }
        return playAt(
          typeof data.index === "number" ? data.index : index,
          data.autoPlay !== false,
          typeof data.t === "number" ? data.t : 0
        );
      });
      return;
    }
    if (type === "play" || type === "resume") {
      withList(function () {
        if (data.id || typeof data.index === "number") {
          var idx = typeof data.index === "number" ? data.index : index;
          if (data.id) {
            for (var i = 0; i < tracks.length; i++) {
              if (tracks[i] && tracks[i].id === data.id) { idx = i; break; }
            }
          }
          return playAt(idx, true, typeof data.t === "number" ? data.t : 0);
        }
        return toggle().then(function (ok) {
          if (!ok || (audio && audio.paused)) return playAt(index, true, typeof data.t === "number" ? data.t : 0);
          return ok;
        });
      });
      return;
    }
    if (type === "pause") {
      try { audio.pause(); } catch (e0) {}
      pushState();
      return;
    }
    if (type === "toggle") { withList(function () { return toggle(); }); return; }
    if (type === "next") { withList(function () { next(false); }); return; }
    if (type === "prev") { withList(function () { prev(); }); return; }
    if (type === "seek" && typeof data.t === "number") {
      pendingSeek = data.t;
      applySeek(data.t);
      pushState();
    }
    if (type === "shutdown") {
      try { audio.pause(); } catch (eS) {}
      saveSession(false);
      broadcast({ type: "host-gone" });
      try { window.close(); } catch (eC) {}
    }
  }

  el("prev").innerHTML = svg("prev");
  el("next").innerHTML = svg("next");
  el("play").innerHTML = svg("play");
  el("prev").addEventListener("click", function () { prev(); });
  el("next").addEventListener("click", function () { next(false); });
  el("play").addEventListener("click", function () { toggle(); });

  audio.addEventListener("play", pushState);
  audio.addEventListener("pause", pushState);
  audio.addEventListener("seeked", function () {
    if (pendingSeek > 0.5 && Math.abs((audio.currentTime || 0) - pendingSeek) < 2) pendingSeek = 0;
    pushState();
  });
  audio.addEventListener("timeupdate", function () {
    if (!audio || audio.paused) return;
    if (pendingSeek > 1 && (audio.currentTime || 0) < 0.5) {
      try { applySeek(pendingSeek); } catch (e0) {}
    }
    if ((Math.floor(audio.currentTime * 2) % 4) === 0) saveSession(true);
  });
  audio.addEventListener("ended", function () {
    if (repeat === "one") playAt(index, true, 0);
    else next(true);
  });

  if (bc) bc.onmessage = function (ev) { handleCmd(ev.data); };
  window.addEventListener("message", function (ev) {
    try {
      if (ev.origin !== location.origin) return;
      var d = ev.data;
      if (!d || d.channel !== CH) return;
      handleCmd(d);
    } catch (e0) {}
  });
  window.addEventListener("beforeunload", function () {
    broadcast({ type: "host-gone" });
    saveSession(!!(audio && !audio.paused));
  });

  // Close when Unraid page heartbeats stop (main tab closed)
  try { localStorage.setItem(HEART_KEY, String(Date.now())); } catch (eH0) {}
  setInterval(function () {
    var ts = 0;
    try { ts = parseInt(localStorage.getItem(HEART_KEY) || "0", 10) || 0; } catch (e0) {}
    // also treat missing opener as gone after grace
    var openerGone = false;
    try { openerGone = !(window.opener && !window.opener.closed); } catch (e1) { openerGone = true; }
    var age = Date.now() - ts;
    if (ts > 0 && age > HB_MAX_MS && openerGone) {
      try { audio.pause(); } catch (e2) {}
      saveSession(false);
      broadcast({ type: "host-gone" });
      try { window.close(); } catch (e3) {}
    }
  }, 4000);

  loadList().then(function () {
    // restore last session progress into host if present
    try {
      var raw = localStorage.getItem(PLAY_KEY) || sessionStorage.getItem(PLAY_KEY);
      if (raw) {
        var sess = JSON.parse(raw);
        if (sess && tracks.length) {
          if (sess.id) {
            for (var i = 0; i < tracks.length; i++) {
              if (tracks[i] && tracks[i].id === sess.id) { index = i; break; }
            }
          } else if (typeof sess.index === "number") index = sess.index;
          if (typeof sess.t === "number" && sess.t > 0.5) pendingSeek = sess.t;
          if (typeof sess.vol === "number") volume = Math.max(0, Math.min(1, sess.vol));
          if (sess.playing || sess.intent) {
            playAt(index, true, pendingSeek || 0);
          } else {
            playAt(index, false, pendingSeek || 0);
          }
        }
      }
    } catch (eR) {}
    broadcast({ type: "host-ready" });
    pushState();
  });
})();
  </script>
</body>
</html>
