#
# ucwc-auth-fix: large multipart POST hangs because auth subrequest inherits CONTENT_LENGTH
# and PHP-FPM waits for a body that never arrives → 504 → browser stuck on 应用中…
#
# Installed to /boot/config/plugins/theme.effects/ucwc-auth-request.conf and re-injected into
# /etc/nginx/conf.d/locations.conf by ThemeEffects_Loader (rc.nginx rebuilds wipe it).
#
location = /auth-request.php {
    internal;
    include fastcgi_params;
    fastcgi_param CONTENT_LENGTH "";
    fastcgi_param REQUEST_METHOD GET;
}
